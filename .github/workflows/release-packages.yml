name: Prepare and publish npm packages

on:
  push:
    tags:
      - "simulator-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified archives to npm (otherwise prepare artifacts only)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@bramas'

      - name: Install and build packages
        run: pnpm install --frozen-lockfile

      - name: Install Lean version manager
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Validate workspace
        run: |
          pnpm typecheck
          pnpm test

      - name: Prepare the release archives
        run: pnpm packages:pack

      - name: Test the exact release archives in an independent project
        run: SIMULANT_PACKAGES_DIR=dist/packages SIMULANT_LEAN=1 pnpm test:packages

      - name: Check the release tag
        if: github.ref_type == 'tag'
        run: node --input-type=module -e 'import fs from "node:fs"; const packages = JSON.parse(fs.readFileSync("dist/packages/release.json")); if (packages.some(p => `simulator-v${p.version}` !== process.env.GITHUB_REF_NAME)) throw new Error("Tag must match every package version");'

      - name: Upload reviewable release archives
        uses: actions/upload-artifact@v4
        with:
          name: simulant-npm-packages
          path: dist/packages/

      - name: Publish the verified archives
        if: github.event_name == 'push' || inputs.publish
        run: node scripts/publish-packages.mjs --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
