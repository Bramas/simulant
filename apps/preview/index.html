<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulant preview</title>
  <style>
    :root { color-scheme: light dark; --border: #8884; --error: #c62828; --muted: #888; }
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px 16px; }
    header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0; }
    .status { color: var(--muted); }
    .status.stale { color: var(--error); font-weight: 600; }
    #diagnostics { color: var(--error); white-space: pre-wrap; font-family: ui-monospace, monospace; margin: 8px 0; }
    #notes { color: var(--muted); margin: 4px 0; }
    main { display: grid; grid-template-columns: minmax(220px, 280px) minmax(280px, 1fr) minmax(220px, 320px); gap: 16px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section { border: 1px solid var(--border); border-radius: 6px; padding: 8px; min-width: 0; }
    section h2 { font-size: 13px; margin: 0 0 6px; text-transform: uppercase; color: var(--muted); }
    label { display: block; margin: 6px 0 2px; }
    select, button { font: inherit; max-width: 100%; }
    button { margin: 2px 4px 2px 0; }
    canvas { width: 100%; max-width: 420px; aspect-ratio: 1; display: block; margin: 0 auto; }
    #successors button { display: block; width: 100%; text-align: left; margin: 4px 0; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Simulant preview</h1>
    <span id="status" class="status"></span>
  </header>
  <div id="diagnostics"></div>
  <div id="notes"></div>
  <main>
    <section>
      <h2>Experiment</h2>
      <label for="experiment">Experiment</label>
      <select id="experiment"></select>
      <label for="params">Parameters</label>
      <select id="params"></select>
      <div style="margin-top:8px">
        <button id="restart">Restart</button>
        <button id="back">Back</button>
        <button id="check">Check</button>
      </div>
      <pre id="result"></pre>
    </section>
    <section>
      <h2>Configuration</h2>
      <canvas id="canvas" width="420" height="420"></canvas>
      <pre id="config"></pre>
    </section>
    <section>
      <h2>Next step</h2>
      <div id="successors"></div>
      <h2 style="margin-top:12px">Path</h2>
      <pre id="path"></pre>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
